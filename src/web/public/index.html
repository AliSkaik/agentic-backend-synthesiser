<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agentic Backend Synthesiser</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; margin-bottom: .25rem; }
  p.sub { color: #666; margin-top: 0; }
  textarea { width: 100%; min-height: 6rem; font: inherit; padding: .6rem; border: 1px solid #bbb; border-radius: 4px; }
  button { font: inherit; padding: .5rem 1.1rem; border: 0; border-radius: 4px; background: #1a1a1a; color: #fff; cursor: pointer; }
  button[disabled] { background: #999; cursor: default; }
  #status { margin-top: 1.5rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; display: none; }
  #status.running { border-color: #b58900; background: #fffbf0; }
  #status.done    { border-color: #2a7a2a; background: #f2fbf2; }
  #status.failed  { border-color: #b00020; background: #fff5f5; }
  .stage { font-weight: 600; }
  .meta { color: #555; font-size: .9rem; margin-top: .5rem; }
  pre { background: #f6f6f6; padding: .75rem; border-radius: 4px; overflow-x: auto; font-size: .85rem; }
  a.download { display: inline-block; margin-top: .75rem; padding: .5rem 1.1rem; background: #2a7a2a; color: #fff; text-decoration: none; border-radius: 4px; }
</style>
</head>
<body>
<h1>Agentic Backend Synthesiser</h1>
<p class="sub">Describe a feature. The pipeline synthesises a PostgreSQL schema and an Express router, verifies both deterministically, and returns them only if every layer passes.</p>

<form id="form">
  <textarea id="description" placeholder="A blog with users, posts and tags. Posts belong to a user and can have many tags."></textarea>
  <p><button id="submit" type="submit">Generate</button></p>
</form>

<div id="status">
  <div class="stage" id="stage"></div>
  <div class="meta" id="meta"></div>
  <pre id="error" hidden></pre>
  <a class="download" id="download" hidden>Download backend.zip</a>
</div>

<script>
const form = document.getElementById("form");
const box = document.getElementById("status");
const stage = document.getElementById("stage");
const meta = document.getElementById("meta");
const errorBox = document.getElementById("error");
const download = document.getElementById("download");
const submit = document.getElementById("submit");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const description = document.getElementById("description").value.trim();
  if (!description) return;

  submit.disabled = true;
  box.style.display = "block";
  box.className = "running";
  errorBox.hidden = true;
  download.hidden = true;
  stage.textContent = "Submitting…";
  meta.textContent = "";

  const started = Date.now();
  const res = await fetch("/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ description }),
  });
  if (!res.ok) {
    box.className = "failed";
    stage.textContent = "Rejected";
    errorBox.hidden = false;
    errorBox.textContent = JSON.stringify(await res.json(), null, 2);
    submit.disabled = false;
    return;
  }
  const { id } = await res.json();

  // A run takes minutes. Poll rather than hold the connection open.
  const timer = setInterval(async () => {
    const job = await (await fetch("/status/" + id)).json();
    const elapsed = ((Date.now() - started) / 1000).toFixed(0);
    stage.textContent = job.stage ?? job.status;

    const bits = [`${elapsed}s elapsed`];
    if (job.schemaAttempts) bits.push(`Agent 1: ${job.schemaAttempts} attempt(s)`);
    if (job.routeAttempts) bits.push(`Agent 2: ${job.routeAttempts} attempt(s)`);
    meta.textContent = bits.join("  ·  ");

    if (job.status === "done") {
      clearInterval(timer);
      box.className = "done";
      stage.textContent = "Verified";
      meta.textContent = `Ingestion to archive: ${job.latencyMs} ms  ·  Agent 1: ${job.schemaAttempts} attempt(s)  ·  Agent 2: ${job.routeAttempts} attempt(s)`;
      download.href = job.download;
      download.hidden = false;
      submit.disabled = false;
    } else if (job.status === "failed") {
      clearInterval(timer);
      box.className = "failed";
      // Verified-or-nothing: no download link is offered on a failed run.
      stage.textContent = job.failedLayer !== null
        ? `Not verified — failed at Layer ${job.failedLayer}`
        : "Not verified";
      errorBox.hidden = false;
      errorBox.textContent = JSON.stringify(job.error, null, 2);
      submit.disabled = false;
    }
  }, 1500);
});
</script>
</body>
</html>
